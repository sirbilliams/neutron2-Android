name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch SDL2 + gl4es (pinned)
        run: bash fetch-deps.sh

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Negatron-Viewer.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Negatron-Viewer-apk
          path: out/Negatron-Viewer.apk
          if-no-files-found: error

  linux:
    name: Linux desktop build (engine check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl-dev zlib1g-dev cmake
      - name: Build engine, viewer, samples, data test
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"
