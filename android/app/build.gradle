apply plugin: 'com.android.application'

// NDK: pinned for reproducible builds; override with -PndkVersion=... if your SDK has another.
def ndkVer = project.hasProperty('ndkVersion') ? project.property('ndkVersion') : '26.3.11579264'

android {
    namespace 'com.sirbilliams.negatron'
    compileSdkVersion 34
    ndkVersion ndkVer

    defaultConfig {
        applicationId 'com.sirbilliams.negatron'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName '0.1-viewer'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24'
                abiFilters 'arm64-v8a'        // AYN Thor and every current Android handheld
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds are signed with the SDK debug key, so the APK installs directly.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    // SDL needs the native libs built before assets are merged
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
